<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0066ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ReyMarket">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22ReyMarket%22,%22short_name%22:%22ReyMarket%22,%22description%22:%22Platform%20Aplikasi%20Premium%22,%22start_url%22:%22./%22,%22display%22:%22standalone%22,%22orientation%22:%22portrait%22,%22theme_color%22:%22%230066ff%22,%22background_color%22:%22%23ffffff%22,%22icons%22:[{%22src%22:%22https://files.catbox.moe/bb7cnu.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22,%22purpose%22:%22any%20maskable%22}]}">
    <link rel="apple-touch-icon" href="https://files.catbox.moe/bb7cnu.png">
    <title>ReyMarket - Platform Aplikasi Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>

    <!-- MODAL LOGIN ADMIN -->
    <div class="modal-overlay" id="adminLoginModal">
        <div class="modal-sheet">
            <div class="modal-sheet-handle"></div>
            <div class="msheet-header">
                <div class="msheet-title-wrap">
                    <div class="msheet-icon-badge" style="background:linear-gradient(135deg,#0066ff,#2ed573)"><i class="fas fa-shield-alt"></i></div>
                    <div>
                        <div class="msheet-title">Login Admin</div>
                        <div class="msheet-subtitle">Masuk dengan akun admin terdaftar</div>
                    </div>
                </div>
                <button class="msheet-close-btn" onclick="closeAdminLoginModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="msheet-body">
                <div style="display:flex;flex-direction:column;gap:12px;padding:4px 0;">
                    <input type="email" id="adminLoginEmail" placeholder="Email admin" autocomplete="username" style="padding:12px 14px;border-radius:12px;border:1.5px solid var(--border-subtle);background:var(--bg-secondary);color:var(--text-main);font-size:0.9rem;">
                    <input type="password" id="adminLoginPassword" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter') submitAdminLogin()" style="padding:12px 14px;border-radius:12px;border:1.5px solid var(--border-subtle);background:var(--bg-secondary);color:var(--text-main);font-size:0.9rem;">
                    <button onclick="submitAdminLogin()" style="padding:13px;border-radius:12px;border:none;background:var(--primary);color:white;font-weight:700;font-size:0.9rem;cursor:pointer;">Masuk sebagai Admin</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL RESELLER -->
    <div class="modal-overlay" id="resellerModal">
        <div class="modal-sheet">
            <div class="modal-sheet-handle"></div>
            <div class="msheet-header">
                <div class="msheet-title-wrap">
                    <div class="msheet-icon-badge" style="background:linear-gradient(135deg,#ff6b35,#ffa502)"><i class="fas fa-store"></i></div>
                    <div>
                        <div class="msheet-title">Program Reseller</div>
                        <div class="msheet-subtitle" id="resellerSubtitle">Bergabung dan dapatkan harga spesial</div>
                    </div>
                </div>
                <button class="msheet-close-btn" onclick="closeResellerModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="msheet-body" id="resellerContent">
                <div style="text-align:center;padding:20px;">
                    <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--primary);"></i>
                </div>
            </div>
        </div>
    </div>

    <div id="app" style="display:none;"></div>

    <script src="app.js"></script>
</body>
</html>
